<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta
      name="description"
      content="PULSE — plan, track, and crush your workouts. Structured programs, a workout player with rest timers, progress analytics, and calculators that run entirely on your device."
    />
    <title>PULSE — Workout Tracker</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pulse:theme')
          document.documentElement.dataset.theme =
            t === 'light' || t === 'dark' ? t : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
